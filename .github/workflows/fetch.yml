name: 抓取文章清单

on:
  schedule:
    - cron: "17 22,4,10 * * *"   # 北京时间每天 6:17、12:17、18:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node fetch.js
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || { git commit -m "更新文章清单"; git push; }
